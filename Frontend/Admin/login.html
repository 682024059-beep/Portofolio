<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Login Admin - Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <link rel="stylesheet" href="/Frontend/admin/css/base.css" />
  <link rel="stylesheet" href="/Frontend/admin/css/login.css" />
</head>

<body class="login-body">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <i class="fas fa-code"></i>
        </div>

        <h1>Admin Panel</h1>
        <p>Masuk ke panel manajemen portfolio kamu</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label>
            <i class="fas fa-envelope"></i> Email
          </label>
          <input
            type="email"
            id="input-email"
            placeholder="Masukkan email admin"
            required
          />
        </div>

        <div class="form-group">
          <label>
            <i class="fas fa-lock"></i> Password
          </label>
          <input
            type="password"
            id="input-password"
            placeholder="Masukkan password"
            required
          />
        </div>

        <button type="submit" class="btn-login" id="btn-login">
          <i class="fas fa-unlock"></i> Login
        </button>
      </form>

      <p style="text-align:center; margin-top:16px; font-size:14px;">
        Belum punya akun?
        <a href="/admin/register">Register Admin</a>
      </p>

      <div id="login-feedback" class="login-feedback"></div>
    </div>
  </div>

  <script src="/Frontend/admin/js/login.js"></script>
</body>
</html>
