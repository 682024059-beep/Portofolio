<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Register Admin - Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <link rel="stylesheet" href="/Frontend/admin/css/base.css" />
  <link rel="stylesheet" href="/Frontend/admin/css/login.css" />
</head>

<body class="login-body">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <i class="fas fa-user-plus"></i>
        </div>

        <h1>Register Admin</h1>
        <p>Buat akun admin baru untuk portfolio kamu</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label>
            <i class="fas fa-envelope"></i> Email
          </label>
          <input
            type="email"
            id="input-email"
            placeholder="Masukkan email admin"
            required
          />
        </div>

        <div class="form-group">
          <label>
            <i class="fas fa-lock"></i> Password
          </label>
          <input
            type="password"
            id="input-password"
            placeholder="Minimal 6 karakter"
            required
          />
        </div>

        <div class="form-group">
          <label>
            <i class="fas fa-lock"></i> Konfirmasi Password
          </label>
          <input
            type="password"
            id="input-confirm-password"
            placeholder="Ulangi password"
            required
          />
        </div>

        <button type="submit" class="btn-login" id="btn-register">
          <i class="fas fa-user-plus"></i> Register
        </button>
      </form>

      <p style="text-align:center; margin-top:16px; font-size:14px;">
        Sudah punya akun?
        <a href="/admin">Login Admin</a>
      </p>

      <div id="register-feedback" class="login-feedback"></div>
    </div>
  </div>

  <script src="/Frontend/admin/js/register.js"></script>
</body>
</html>
