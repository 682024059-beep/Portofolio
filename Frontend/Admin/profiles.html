<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profil - Admin Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="/Frontend/admin/css/base.css" />
  <link rel="stylesheet" href="/Frontend/admin/css/profiles.css" />
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-logo"><i class="fas fa-code"></i> Admin</span>
      <button class="sidebar-close" id="sidebar-close"><i class="fas fa-times"></i></button>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="sidebar-link"><i class="fas fa-chart-pie"></i> Dashboard</a>
      <a href="profiles.html" class="sidebar-link active"><i class="fas fa-user"></i> Profil</a>
      <a href="skills.html" class="sidebar-link"><i class="fas fa-star"></i> Skills</a>
      <a href="experience.html" class="sidebar-link"><i class="fas fa-briefcase"></i> Pengalaman</a>
      <a href="projects.html" class="sidebar-link"><i class="fas fa-folder-open"></i> Proyek</a>
    </nav>
    <div class="sidebar-footer">
      <a href="/" target="_blank" class="sidebar-link"><i class="fas fa-external-link-alt"></i> Lihat Portfolio</a>
      <button class="sidebar-link btn-logout" id="btn-logout"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </aside>
  <div class="overlay" id="overlay"></div>
  <div class="main-wrap">
    <header class="topbar">
      <button class="hamburger-btn" id="hamburger-btn"><i class="fas fa-bars"></i></button>
      <h2 class="topbar-title">Edit Profil</h2>
      <div class="topbar-user"><i class="fas fa-user-circle"></i><span id="topbar-email">admin</span></div>
    </header>
    <main class="content-area">
      <div class="page-header">
        <h1 class="page-title">Edit Profil</h1>
        <p class="page-subtitle">Kelola informasi profil yang tampil di portfolio.</p>
      </div>

      <div class="profile-grid">
        <!-- Photo Card -->
        <div class="card photo-card">
          <h3 class="card-title"><i class="fas fa-camera"></i> Foto Profil</h3>
          <div class="photo-preview-wrap">
            <img id="photo-preview" src="https://placehold.co/200x200/93c5fd/1d4ed8?text=Foto" alt="Foto Profil" class="photo-preview" />
            <div class="photo-overlay" id="photo-overlay">
              <i class="fas fa-camera"></i>
              <span>Ganti Foto</span>
            </div>
          </div>
          <input type="file" id="photo-input" accept="image/*" hidden />
          <button class="btn btn-primary" id="btn-upload-photo" style="margin-top:12px; width:100%;">
            <i class="fas fa-upload"></i> Upload Foto Baru
          </button>
          <p class="photo-hint">Disarankan: foto kotak, min 200x200px.</p>

          <!-- Background Color -->
          <div class="form-group" style="margin-top:20px;">
            <label><i class="fas fa-palette"></i> Warna Background Portfolio</label>
            <div class="color-options" id="color-options">
              <button class="color-opt" data-color="#dbeafe" style="background:#dbeafe" title="Biru Pastel"></button>
              <button class="color-opt" data-color="#ede9fe" style="background:#ede9fe" title="Ungu Pastel"></button>
              <button class="color-opt" data-color="#dcfce7" style="background:#dcfce7" title="Hijau Pastel"></button>
              <button class="color-opt" data-color="#fce7f3" style="background:#fce7f3" title="Pink Pastel"></button>
              <button class="color-opt" data-color="#fef9c3" style="background:#fef9c3" title="Kuning Pastel"></button>
              <button class="color-opt" data-color="#ffedd5" style="background:#ffedd5" title="Orange Pastel"></button>
              <button class="color-opt" data-color="#f1f5f9" style="background:#f1f5f9" title="Abu-abu"></button>
              <button class="color-opt" data-color="#ffffff" style="background:#ffffff;border:1px solid #e2e8f0" title="Putih"></button>
            </div>
            <input type="hidden" id="bg-color-input" value="#dbeafe" />
          </div>
        </div>

        <!-- Info Form -->
        <div class="card">
          <h3 class="card-title"><i class="fas fa-user-edit"></i> Informasi Diri</h3>
          <form id="profile-form">
            <div class="form-row">
              <div class="form-group">
                <label>Nama Lengkap *</label>
                <input type="text" id="f-name" placeholder="Nama Kamu" required />
              </div>
              <div class="form-group">
                <label>Tagline</label>
                <input type="text" id="f-tagline" placeholder="Backend Developer & ..." />
              </div>
            </div>
            <div class="form-group">
              <label>Bio</label>
              <textarea id="f-bio" rows="4" placeholder="Ceritakan tentang dirimu..."></textarea>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Email</label>
                <input type="email" id="f-email" placeholder="kamu@email.com" />
              </div>
              <div class="form-group">
                <label>No. Telepon</label>
                <input type="text" id="f-phone" placeholder="+62..." />
              </div>
            </div>
            <div class="form-group">
              <label>Lokasi</label>
              <input type="text" id="f-location" placeholder="Kota, Indonesia" />
            </div>
            <div class="form-row">
              <div class="form-group">
                <label><i class="fab fa-github"></i> GitHub URL</label>
                <input type="url" id="f-github" placeholder="https://github.com/..." />
              </div>
              <div class="form-group">
                <label><i class="fab fa-linkedin"></i> LinkedIn URL</label>
                <input type="url" id="f-linkedin" placeholder="https://linkedin.com/in/..." />
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label><i class="fab fa-instagram"></i> Instagram URL</label>
                <input type="url" id="f-instagram" placeholder="https://instagram.com/..." />
              </div>
              <div class="form-group">
                <label>Resume URL</label>
                <input type="url" id="f-resume" placeholder="https://..." />
              </div>
            </div>
            <button type="submit" class="btn btn-primary btn-full">
              <i class="fas fa-save"></i> Simpan Perubahan
            </button>
          </form>
        </div>
      </div>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <script src="/Frontend/admin/js/api.js"></script>
  <script src="/Frontend/admin/js/base.js"></script>
  <script src="/Frontend/admin/js/profiles.js"></script>
</body>
</html>
